<!doctype html>
<html lang="tr" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>CYBERBULLY27 | PS4 13.52</title>
    <style>
      :root {
        --bg: #05070d;
        --bg-deep: #02040a;
        --panel: rgba(10, 16, 30, 0.94);
        --panel-strong: #0c1424;
        --primary: #008cff;
        --primary-soft: #38b6ff;
        --secondary: #6b4dff;
        --accent: #19ff73;
        --text: #ffffff;
        --muted: #aab8d0;
        --line: rgba(255, 255, 255, 0.09);
        --success: #48e39a;
        --error: #ff5f72;
        --warning: #ffc45c;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", Arial, sans-serif;
      }
      body {
        min-height: 100vh;
        overflow: hidden;
        background:
          linear-gradient(rgba(2, 4, 10, 0.3), rgba(2, 4, 10, 0.82)),
          radial-gradient(circle at 50% -18%, rgba(0, 140, 255, 0.2), transparent 32%),
          url("cyberbully27-bg.png") center center / cover no-repeat,
          linear-gradient(135deg, #08101f 0%, var(--bg) 48%, var(--bg-deep) 100%);
      }
      .grid {
        position: fixed;
        inset: 0;
        opacity: 0.07;
        background-image:
          linear-gradient(rgba(94, 164, 255, 0.32) 1px, transparent 1px),
          linear-gradient(90deg, rgba(94, 164, 255, 0.32) 1px, transparent 1px);
        background-size: 44px 44px;
      }
      .grid:after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(120deg, transparent 0 18%, rgba(0, 140, 255, 0.16) 18.2%, transparent 18.6% 100%),
          linear-gradient(158deg, transparent 0 63%, rgba(25, 255, 115, 0.14) 63.2%, transparent 63.6% 100%);
      }
      .shell {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        min-height: 78px;
        padding: 0 38px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(3, 7, 14, 0.9);
        border-bottom: 1px solid var(--line);
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .mark {
        width: 52px;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(0, 140, 255, 0.55);
        border-radius: 8px;
        background: linear-gradient(145deg, rgba(0, 140, 255, 0.22), rgba(25, 255, 115, 0.08));
        color: var(--accent);
        font-size: 20px;
        font-weight: 900;
        box-shadow: 0 0 28px rgba(0, 140, 255, 0.18);
      }
      .logo strong, .logo small {
        display: block;
        letter-spacing: 0.12em;
      }
      .logo strong {
        font-size: 21px;
        line-height: 1.1;
      }
      .logo strong span { color: var(--primary-soft); }
      .logo small {
        margin-top: 5px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
      }
      .badge {
        padding: 8px 14px;
        border: 1px solid rgba(0, 140, 255, 0.35);
        border-radius: 8px;
        color: #d6e4ff;
        font-size: 12px;
        letter-spacing: 0.08em;
        background: rgba(12, 20, 36, 0.88);
      }
      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px;
      }
      .card {
        width: 760px;
        max-width: 94vw;
        padding: 40px 44px 34px;
        text-align: center;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow:
          0 24px 70px rgba(0, 0, 0, 0.48),
          0 0 42px rgba(0, 140, 255, 0.1),
          inset 0 1px rgba(255, 255, 255, 0.04);
      }
      .eyebrow {
        margin: 0 0 12px;
        color: var(--primary-soft);
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.18em;
      }
      h1 {
        margin: 0;
        font-size: 42px;
        line-height: 1.05;
        letter-spacing: 0.02em;
      }
      .subtitle {
        margin: 10px 0 28px;
        color: #d6e4ff;
        font-size: 22px;
        font-weight: 700;
      }
      #state {
        min-height: 30px;
        font-size: 20px;
        font-weight: 800;
      }
      #det {
        margin-top: 12px;
        color: var(--muted);
        font-size: 17px;
        font-weight: 600;
      }
      #det b { color: #e9f2ff; }
      #cache {
        min-height: 20px;
        margin-top: 18px;
        color: #8ea2c2;
        font-size: 16px;
        font-weight: 700;
      }
      #cache.cacheok, .ok { color: var(--success); }
      .bad { color: var(--error) !important; }
      .warn { color: var(--warning) !important; }
      .versions {
        margin-top: 30px;
        padding-top: 22px;
        border-top: 1px solid var(--line);
        display: flex;
        justify-content: center;
        gap: 10px;
      }
      .versions span {
        min-width: 64px;
        padding: 9px 12px;
        border: 1px solid rgba(0, 140, 255, 0.3);
        border-radius: 8px;
        color: #cfe1ff;
        background: var(--panel-strong);
        font-size: 13px;
        font-weight: 800;
      }
      footer {
        padding: 17px;
        text-align: center;
        color: #7f92b2;
        font-size: 11px;
        letter-spacing: 0.08em;
      }
      @media (max-width: 720px) {
        header {
          min-height: 70px;
          padding: 0 18px;
        }
        .badge { display: none; }
        .mark {
          width: 46px;
          height: 46px;
        }
        .logo strong { font-size: 18px; }
        .card { padding: 32px 20px; }
        h1 { font-size: 32px; }
        .subtitle { font-size: 18px; }
        .versions { flex-wrap: wrap; }
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="shell">
      <header>
        <div class="logo">
          <div class="mark">C27</div>
          <div>
            <strong>CYBER<span>BULLY27</span></strong>
            <small>PS4 13.52</small>
          </div>
        </div>
        <div class="badge">PS4 Jailbreak &amp; Payload Center</div>
      </header>
      <main>
        <section class="card">
          <p class="eyebrow">CYBERBULLY27</p>
          <h1>PS4 13.52</h1>
          <div class="subtitle">GoldHEN Launcher</div>
          <div id="state">Yazılım sürümü denetleniyor...</div>
          <div id="det"></div>
          <div id="cache"></div>
          <div class="versions">
            <span>13.02</span><span>13.04</span><span>13.50</span><span>13.52</span>
          </div>
        </section>
      </main>
      <footer>CYBERBULLY27 • PS4 13.52 GoldHEN Launcher • by Cyberbully27</footer>
    </div>
    <script>
      (function () {
        var stateEl = document.getElementById("state"),
          detEl = document.getElementById("det"),
          cacheEl = document.getElementById("cache");
        function setState(t, c) {
          stateEl.textContent = t;
          stateEl.className = c || "";
        }
        function setCache(t, ok) {
          cacheEl.textContent = t;
          cacheEl.className = ok ? "cacheok" : "";
        }
        var params = new URLSearchParams(location.search),
          SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 },
          key = null,
          fwnum = null,
          m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
        if (m) {
          var ms = parseInt(m[2], 16).toString(16);
          if (ms.length < 2) ms = "0" + ms;
          key = m[1] + "." + ms;
          fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
        }
        var forced = params.get("force") === "1",
          supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
        detEl.innerHTML =
          "Firmware: <b>" +
          (key || "algılanamadı") +
          "</b>" +
          (supported
            ? " &nbsp;•&nbsp; <b>uyumlu</b>"
            : " &nbsp;•&nbsp; bu sürüm destek listesinde değil");
        var target = "jb.html" + location.search;
        function go() {
          setState("Jailbreak başlatılıyor...", "warn");
          location.replace(target);
        }
        function waitForTap(msg, action) {
          setState(msg, "warn");
          function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
          }
          window.addEventListener("click", fire);
          window.addEventListener("keydown", fire);
        }
        if (!supported) {
          setState("DESTEKLENMEYEN FIRMWARE", "bad");
          waitForTap("Yine de çalıştırmak için X tuşuna basın.", go);
          return;
        }
        var ac = window.applicationCache;
        if (!ac || !document.documentElement.hasAttribute("manifest")) {
          go();
        } else if (!navigator.onLine) {
          setCache("Çevrimdışı önbellekten çalıştırılıyor.", true);
          go();
        } else if (ac.status === ac.IDLE) {
          setCache("Çevrimdışı kullanım hazır.", true);
          go();
        } else if (ac.status === ac.UPDATEREADY) {
          try {
            ac.swapCache();
          } catch (e) {}
          setCache("Güncelleme indirildi.", true);
          waitForTap("Yenileyip çalıştırmak için X tuşuna basın.", function () {
            location.reload();
          });
        } else {
          setCache("Önbellek kontrol ediliyor...");
          ac.addEventListener(
            "downloading",
            function () {
              setCache("İlk kullanım için çevrimdışı dosyalar hazırlanıyor...");
            },
            false,
          );
          ac.addEventListener(
            "progress",
            function (e) {
              if (e && e.total)
                setCache("Hazırlanıyor: %" + Math.round((e.loaded / e.total) * 100));
            },
            false,
          );
          ac.addEventListener(
            "cached",
            function () {
              setCache("Çevrimdışı kullanım hazır.", true);
              waitForTap("Devam etmek için X tuşuna basın.", go);
            },
            false,
          );
          ac.addEventListener(
            "updateready",
            function () {
              try {
                ac.swapCache();
              } catch (e) {}
              setCache("Güncelleme hazır.", true);
              waitForTap("Sayfayı yenilemek için X tuşuna basın.", function () {
                location.reload();
              });
            },
            false,
          );
          ac.addEventListener(
            "noupdate",
            function () {
              setCache("Çevrimdışı kullanım hazır.", true);
              go();
            },
            false,
          );
          ac.addEventListener(
            "error",
            function () {
              setCache("Önbellek hazırlanamadı.");
              waitForTap("Yine de çalıştırmak için X tuşuna basın.", go);
            },
            false,
          );
          ac.addEventListener(
            "obsolete",
            function () {
              setCache("Önbellek güncel değil.");
              waitForTap("Devam etmek için X tuşuna basın.", go);
            },
            false,
          );
        }
      })();
    </script>
  </body>
</html>
